<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>José Luis Olazagotia — Welcome Pack</title>
  <link rel="stylesheet" href="../../Recursos/CSS/global.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="video-page">

    <!-- ═══════════════════════════════════════════════════════
         COLUMNA IZQUIERDA: reproductor con overlay de preview
    ════════════════════════════════════════════════════════ -->
    <div class="video-col">
      <div class="video-player" data-state="preview"
           data-video-rector="../VideoPlaceholder.mp4"
           data-preview-rector="../../Recursos/Imagenes/Miniatura_JoseLuisOlazagoita.png"
           data-alt-rector="José Luis Olazagotia, Rector">

        <video class="video-player__video" src="../VideoPlaceholder.mp4" preload="metadata" controls></video>

        <!-- Overlay: visible antes de iniciar y al finalizar -->
        <div class="video-player__overlay">

          <!-- Imagen de preview -->
          <img class="video-player__preview"
               src="../../Recursos/Imagenes/Miniatura_JoseLuisOlazagoita.png"
               alt="José Luis Olazagotia, Rector" />

          <!-- Botón play centrado -->
          <button class="video-player__play" aria-label="Reproducir vídeo de José Luis Olazagotia">
            <svg viewBox="0 0 48 55" fill="white" aria-hidden="true">
              <polygon points="0,0 48,27.5 0,55" />
            </svg>
          </button>

        </div><!-- /.video-player__overlay -->
      </div><!-- /.video-player -->

      <!-- Vídeos relacionados — absolute sobre el vídeo en desktop, flujo normal en móvil -->
      <aside class="related-videos" aria-label="Otros vídeos">
        <div class="related-item is-disabled" aria-hidden="true">
          <div class="related-item__thumb" aria-hidden="true"></div>
          <div class="related-item__meta">
            <p class="related-item__name">Juan Cayón</p>
            <p class="related-item__role">Rector</p>
          </div>
        </div>
        <div class="related-item is-disabled" aria-hidden="true">
          <div class="related-item__thumb has-image" style="background-image: url('../../Recursos/Imagenes/Miniatura_MarisaSarget.png');" aria-hidden="true"></div>
          <div class="related-item__meta">
            <p class="related-item__name">Marisa Sarget</p>
            <p class="related-item__role">Vicerrectora de Ordenación Académica y Profesorado</p>
          </div>
        </div>
        <button type="button" class="related-item related-item--switch is-active"
                data-video="../VideoPlaceholder.mp4"
                data-preview="../../Recursos/Imagenes/Miniatura_JoseLuisOlazagoita.png"
                data-alt="José Luis Olazagotia, Vicerrector de Investigación">
          <div class="related-item__thumb has-image" style="background-image: url('../../Recursos/Imagenes/Miniatura_JoseLuisOlazagoita.png');" aria-hidden="true"></div>
          <div class="related-item__meta">
            <p class="related-item__name">José Luis Olazagotia</p>
            <p class="related-item__role">Vicerrector de Investigación</p>
          </div>
        </button>
      </aside>

    </div><!-- /.video-col -->

    <!-- ═══════════════════════════════════════════════════════
         COLUMNA DERECHA: info del ponente
    ════════════════════════════════════════════════════════ -->
    <section class="video-info" aria-labelledby="speaker-name">

      <div class="video-info__header">
        <h1 class="video-info__name" id="speaker-name">
          <span class="vid-mask"><span class="vid-word">José</span></span>
          <span class="vid-mask"><span class="vid-word">Luis</span></span>
          <span class="vid-mask"><span class="vid-word">Olazagotia</span></span>
        </h1>
        <p class="video-info__role">Rector<br>Vicerrector de Investigación</p>
      </div>

      <blockquote class="video-quote">
        <img class="video-quote__mark video-quote__mark--open" src="../../Recursos/Imagenes/Imagen_Comilla_Abrir.svg" alt="" aria-hidden="true" />
        <p class="video-quote__text">Tu carrera crece investigando, y no vas a empezar solo.</p>
        <img class="video-quote__mark video-quote__mark--close" src="../../Recursos/Imagenes/Imagen_Comilla_Cerrar.svg" alt="" aria-hidden="true" />
      </blockquote>

      <div class="video-signature">
        <img src="../../Recursos/firmas/Olazagoita.png" alt="" aria-hidden="true" />
      </div>

      <a class="btn-back" href="../../Home/index.html">
        <svg width="13" height="11" viewBox="0 0 13 11" fill="none" aria-hidden="true">
          <path d="M12 5.5H1M1 5.5L5.5 1M1 5.5L5.5 10" stroke="white" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Volver
      </a>

    </section>

  </main>

  <script>
    (function () {
      var videoCol = document.querySelector('.video-col');
      var players  = document.querySelectorAll('.video-player');

      function updatePlayingState() {
        var anyPlaying = Array.prototype.some.call(players, function (p) {
          return p.dataset.state === 'playing';
        });
        videoCol.classList.toggle('is-playing', anyPlaying);
      }

      players.forEach(function (player) {
        var overlay = player.querySelector('.video-player__overlay');
        var video   = player.querySelector('video');

        overlay.addEventListener('click', function () {
          video.play();
        });

        video.addEventListener('play', function () {
          player.dataset.state = 'playing';
          updatePlayingState();
        });

        video.addEventListener('pause', function () {
          if (!video.ended) player.dataset.state = 'paused';
          updatePlayingState();
        });

        video.addEventListener('ended', function () {
          player.dataset.state = 'preview';
          updatePlayingState();
        });
      });

      // Botones que sustituyen el vídeo principal (Rector / Vicerrector) sin salir de la página
      var player  = players[0];
      var video   = player.querySelector('video');
      var preview = player.querySelector('.video-player__preview');

      document.querySelectorAll('.related-item--switch').forEach(function (btn) {
        btn.addEventListener('click', function () {
          video.pause();
          video.currentTime = 0;
          video.src = btn.dataset.video;
          preview.src = btn.dataset.preview;
          preview.alt = btn.dataset.alt;
          player.dataset.state = 'preview';
          updatePlayingState();

          document.querySelectorAll('.related-item--switch').forEach(function (b) {
            b.classList.remove('is-active');
          });
          btn.classList.add('is-active');
        });
      });
    })();
  </script>
</body>
</html>
